<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />

    <!--
      This shell serves both the software and the gun shop's landing page, so the
      static values here describe the software (ForgeMark Industries) and the
      landing page sets its own title and description at runtime. See docs/BRAND.md.
    -->
    <title>Engraving Prep Tool — ForgeMark Industries</title>
    <meta
      name="description"
      content="Lay out and export laser engraving and marking work: design preparation, FFL and NFA marking blocks, masks, vector tools, and actual-size export."
    />
    <meta name="author" content="ForgeMark Industries" />
    <link rel="icon" type="image/png" href="/icon.png" />

    <meta
      property="og:title"
      content="Engraving Prep Tool — ForgeMark Industries"
    />
    <meta
      property="og:description"
      content="Lay out and export laser engraving and marking work, including FFL and NFA marking blocks."
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          let prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          theme = prefersDark ? "dark" : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
