name: Cloudflare migration check
on:
  pull_request:
    branches: ["release/desktop-beta"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm cloudflare:check
