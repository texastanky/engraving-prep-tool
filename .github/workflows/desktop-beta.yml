name: Desktop beta candidate

on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test desktop/project-warning.test.cjs
      - run: pnpm lint
      - run: pnpm build
      - name: Package isolated beta installer without publishing
        run: >-
          pnpm exec electron-builder --win nsis --x64 --publish never
          --config.appId=com.forgemarkindustries.engravingprep.beta
          --config.productName="Engraving Prep Tool Beta"
          --config.extraMetadata.name=engraving-prep-tool-beta
          --config.extraMetadata.productName="Engraving Prep Tool Beta"
          --config.nsis.shortcutName="Engraving Prep Tool Beta"
          --config.nsis.uninstallDisplayName="Engraving Prep Tool Beta"
          --config.nsis.artifactName='EngravingPrepTool-Beta-Setup-${version}.${ext}'
      - name: Install beta and record its identity and checksum
        run: |
          $installer = Get-ChildItem desktop-dist/EngravingPrepTool-Beta-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Beta installer was not produced" }
          $directory = Join-Path $env:RUNNER_TEMP "engraving-prep-beta"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$directory") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $executable = Join-Path $directory "Engraving Prep Tool Beta.exe"
          if (-not (Test-Path $executable)) { throw "Installed beta executable is missing" }
          $product = (Get-Item $executable).VersionInfo.ProductName
          if ($product -ne "Engraving Prep Tool Beta") { throw "Unexpected product: $product" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content desktop-dist/SHA256SUMS.txt
          @{
            commit = "${{ github.sha }}"
            product = $product
            installerExitCode = $process.ExitCode
            signature = (Get-AuthenticodeSignature $installer.FullName).Status.ToString()
            installerSha256 = $hash
            appWorkflowTested = $false
          } | ConvertTo-Json | Set-Content desktop-dist/installer-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: engraving-prep-beta-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop-dist/EngravingPrepTool-Beta-Setup-*.exe
            desktop-dist/SHA256SUMS.txt
            desktop-dist/installer-report.json
            docs/BETA-TESTING.md
